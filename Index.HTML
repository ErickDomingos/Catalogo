<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo completo — Pixelteca</title>
    <meta
      name="description"
      content="Os 36 jogos do acervo da Pixelteca com filtros por gênero e plataforma, ficha técnica, duração média e nota."
    />
    <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <a class="pular-link" href="#conteudo">Pular para o conteúdo</a>

    <header class="cabecalho">
      <div class="envolucro cabecalho__interno">
        <a class="marca" href="index.html">
          <img src="img/logo.svg" alt="" width="40" height="40" />
          <span class="marca__nome">Pixelteca</span>
        </a>
        <nav aria-label="Navegação principal">
          <ul class="menu">
            <li><a class="menu__link" href="index.html">Início</a></li>
            <li>
              <a class="menu__link" href="catalogo.html" aria-current="page">Catálogo</a>
            </li>
            <li><a class="menu__link" href="sugestoes.html">Sugerir um jogo</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="conteudo" class="envolucro">
      <div class="secao__cabecalho pagina__topo">
        <h1>Catálogo completo</h1>
        <p>
          36 jogos em 9 gêneros. Use os filtros para reduzir a lista ao
          que você joga.
        </p>
      </div>

      <div class="catalogo">
        <!-- Painel de filtros: conteúdo complementar ao catálogo -->
        <aside class="filtros" aria-labelledby="titulo-filtros">
          <h2 id="titulo-filtros">Filtrar acervo</h2>

          <form id="form-filtros">
            <div class="campo">
              <label class="campo__rotulo" for="busca">Buscar por título ou estúdio</label>
              <input
                type="search"
                id="busca"
                name="busca"
                placeholder="ex.: Celeste"
                aria-describedby="ajuda-busca"
              />
              <p class="campo__ajuda" id="ajuda-busca">
                A lista é atualizada enquanto você digita.
              </p>
            </div>

            <div class="campo">
              <label class="campo__rotulo" for="genero">Gênero</label>
              <select id="genero" name="genero">
                <option value="todos">Todos os gêneros</option>
                <option value="Aventura">Aventura</option>
                <option value="Ação">Ação</option>
                <option value="Estratégia">Estratégia</option>
                <option value="Plataforma">Plataforma</option>
                <option value="Puzzle">Puzzle</option>
                <option value="RPG">RPG</option>
                <option value="Roguelike">Roguelike</option>
                <option value="Simulação">Simulação</option>
                <option value="Sobrevivência">Sobrevivência</option>
                <option value="Outro">Outro</option>
              </select>
            </div>

            <fieldset>
              <legend>Plataforma</legend>
              <div class="opcoes">
                <span class="opcao">
                  <input type="checkbox" id="plat-pc" name="plataforma" value="pc" />
                  <label for="plat-pc">PC</label>
                </span>
                <span class="opcao">
                  <input
                    type="checkbox"
                    id="plat-playstation"
                    name="plataforma"
                    value="playstation"
                  />
                  <label for="plat-playstation">PlayStation</label>
                </span>
                <span class="opcao">
                  <input type="checkbox" id="plat-xbox" name="plataforma" value="xbox" />
                  <label for="plat-xbox">Xbox</label>
                </span>
                <span class="opcao">
                  <input type="checkbox" id="plat-switch" name="plataforma" value="switch" />
                  <label for="plat-switch">Switch</label>
                </span>
              </div>
            </fieldset>
